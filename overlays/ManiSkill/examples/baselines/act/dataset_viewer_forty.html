<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>π0.5 数据检查</title>
<style>body{margin:0;background:#0c1420;color:#e8eef7;font:15px system-ui,sans-serif}main{max-width:1800px;margin:30px auto;padding:0 24px}h1{margin-bottom:8px}p{color:#a8bbd1;line-height:1.6}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#152235;padding:16px;border-radius:10px;margin:18px 0}select,button,input{font:inherit}select,button{background:#22364e;color:#fff;border:1px solid #39526b;border-radius:6px;padding:8px}button{cursor:pointer}#frame{width:100%;background:#101926;border-radius:8px;display:block}#scrub{flex:1;min-width:250px}#meta{color:#b9cbe0;line-height:1.8}#message{color:#ffbd74}code{overflow-wrap:anywhere}</style>
<main><h1>π0.5 抓取数据检查</h1><p>1250 条成功轨迹，25 个目标各 50 条，全部为训练集。画面从原始 H5 读取；每条轨迹会核对目标 ID、Mask 与 RGB × Mask。此页面不会运行推理或仿真。</p>
<div class="bar"><label>目标 <select id="target"></select></label><label>轨迹 <select id="episode"></select></label><button id="prev">上一条</button><button id="next">下一条</button></div>
<div id="meta"></div><img id="frame" alt="目标标注、桌面画面、腕部画面、目标 Mask、RGB 乘 Mask"><div class="bar"><button id="play">播放</button><button id="back">上一帧</button><button id="forward">下一帧</button><input id="scrub" type="range" min="0" value="0"><span id="count"></span></div><div id="message"></div>
<p>绿色框是目标，白框是其他物品。第四、第五格分别是二值 Mask 和保留目标纹理的 RGB × Mask。目标被遮挡时，Mask 可能变小或暂时为空。</p>
<script>
const $=id=>document.getElementById(id);let rows=[],visible=[],playing=false,timer,request=0;
function stop(){playing=false;clearTimeout(timer);$('play').textContent='播放'}
function current(){return rows[Number($('episode').value)]}
async function show(t){const id=++request;t=Math.max(0,Math.min(Number($('scrub').max),t));$('scrub').value=t;$('count').textContent=t+' / '+$('scrub').max;try{const response=await fetch(`/api/frame?episode=${$('episode').value}&t=${t}`);if(!response.ok)throw Error((await response.json()).error);const url=URL.createObjectURL(await response.blob());if(id!==request){URL.revokeObjectURL(url);return}const old=$('frame').src;$('frame').src=url;if(old.startsWith('blob:'))URL.revokeObjectURL(old);$('message').textContent='';if(playing){if(t<Number($('scrub').max))timer=setTimeout(()=>show(t+1),80);else stop()}}catch(error){stop();$('message').textContent=error.message}}
function choose(){stop();request++;const row=current();if(!row)return;$('scrub').max=row.steps;$('meta').textContent=`episode ${row.episode_index} | 目标 ${row.target_name} | ${row.steps} 个动作 | seed ${row.seed} | 桌面 8 物品：${row.selected_names.join('、')} | prompt：${row.prompt}`;show(0)}
function filter(){visible=rows.filter(row=>$('target').value==='all'||row.target_name===$('target').value);$('episode').replaceChildren(...visible.map(row=>new Option(`episode ${row.episode_index} · ${row.target_name}`,row.episode_index)));choose()}
for(const [id,step] of [['prev',-1],['next',1]])$(id).onclick=()=>{if(!visible.length)return;$('episode').selectedIndex=($('episode').selectedIndex+step+visible.length)%visible.length;choose()};
$('target').onchange=filter;$('episode').onchange=choose;$('scrub').oninput=()=>{stop();show(Number($('scrub').value))};$('back').onclick=()=>{stop();show(Number($('scrub').value)-1)};$('forward').onclick=()=>{stop();show(Number($('scrub').value)+1)};$('play').onclick=()=>{if(playing)return stop();playing=true;$('play').textContent='暂停';show(Number($('scrub').value)>=Number($('scrub').max)?0:Number($('scrub').value))};
fetch('/api/index').then(response=>response.json()).then(data=>{rows=data;const targets=[...new Set(data.map(row=>row.target_name))];$('target').replaceChildren(new Option('全部目标（1250）','all'),...targets.map(target=>new Option(target+'（50）',target)));filter()}).catch(error=>$('message').textContent=error.message);
</script></main></html>
