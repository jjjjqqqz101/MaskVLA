[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mask-policy-robocasa-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "h5py", "Pillow", "imageio", "imageio-ffmpeg"]
[tool.setuptools.packages.find]
include = ["robocasa_bridge*", "robocasa_pilot*"]

[tool.setuptools.package-data]
robocasa_bridge = ["assets/*.xml"]
